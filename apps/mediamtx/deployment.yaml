apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: rtmp
              containerPort: 1935
            - name: rtsp
              containerPort: 8554
            - name: hls
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
          startupProbe:
            tcpSocket:
              port: hls
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: hls
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: hls
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
