apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: apps-image-updater
  namespace: argocd
spec:
  # Application の helm.parameters に書き込む。auto-sync で自動的に再デプロイされる
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: ubichill
      images:
        - alias: backend
          imageName: ghcr.io/ubichill/ubichill-backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: backend.image.repository
              tag: backend.image.tag
        - alias: frontend
          imageName: ghcr.io/ubichill/ubichill-frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: frontend.image.repository
              tag: frontend.image.tag
        # Go インスタンスサーバー。services/instance に変更があったときだけ新しいタグが出る
        - alias: instance
          imageName: ghcr.io/ubichill/ubichill-instance
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: instanceRuntime.image.repository
              tag: instanceRuntime.image.tag

    # dev 環境は main の最新（:main-<sha>）を追う。:sha-<sha> は PR のプレビューにも付くので追わない
    - namePattern: ubichill-dev
      images:
        - alias: backend
          imageName: ghcr.io/ubichill/ubichill-backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^main-
          manifestTargets:
            helm:
              name: backend.image.repository
              tag: backend.image.tag
        - alias: frontend
          imageName: ghcr.io/ubichill/ubichill-frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^main-
          manifestTargets:
            helm:
              name: frontend.image.repository
              tag: frontend.image.tag
        - alias: instance
          imageName: ghcr.io/ubichill/ubichill-instance
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^main-
          manifestTargets:
            helm:
              name: instanceRuntime.image.repository
              tag: instanceRuntime.image.tag

    # サイボウズの面接用。面接中に壊れないよう本番と同じリリース版（:vX.Y.Z）を追う
    - namePattern: ubichill-cybozu
      images:
        - alias: backend
          imageName: ghcr.io/ubichill/ubichill-backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: backend.image.repository
              tag: backend.image.tag
        - alias: frontend
          imageName: ghcr.io/ubichill/ubichill-frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: frontend.image.repository
              tag: frontend.image.tag
        - alias: instance
          imageName: ghcr.io/ubichill/ubichill-instance
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: instanceRuntime.image.repository
              tag: instanceRuntime.image.tag

    - namePattern: vrc-queue-monitor
      images:
        # api / collector は同じイメージなので 1 エイリアスにまとめる
        - alias: backend
          imageName: ghcr.io/ieyoukan/vrc-queue-monitor/backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              tag: backend.image.tag
        - alias: frontend
          imageName: ghcr.io/ieyoukan/vrc-queue-monitor/frontend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              tag: frontend.image.tag

    - namePattern: videoplayer
      images:
        - alias: backend
          imageName: ghcr.io/ieyoukan/video-player-backend
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag

    - namePattern: pplale-cms
      images:
        - alias: pplale-cms
          imageName: ghcr.io/ieyoukan/pplale-cms
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              tag: image.tag

    - namePattern: pplale-cpu-server
      images:
        - alias: pplale-cpu-server
          imageName: ghcr.io/ieyoukan/pplale-cpu-server
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              tag: image.tag

    - namePattern: pplale-room-server
      images:
        - alias: pplale-room-server
          imageName: ghcr.io/ieyoukan/pplale-room-server
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              tag: image.tag

    - namePattern: taifu-kanakana
      images:
        - alias: taifu-kanakana
          imageName: ghcr.io/ieyoukan/taifu-kanakana
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^v[0-9]
          manifestTargets:
            helm:
              tag: image.tag

    # 3d-scanner: main への push ごとに Actions が、中身の変わったイメージだけ :sha-<短縮コミット> を公開する。
    # :latest は追わない。画面（web）・API（api）・復元（worker）を別々に更新する
    - namePattern: 3d-scanner
      images:
        - alias: web
          imageName: ghcr.io/ieyoukan/3d-scanner-web
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^sha-[0-9a-f]+$
          manifestTargets:
            helm:
              name: web.image.repository
              tag: web.image.tag
        - alias: api
          imageName: ghcr.io/ieyoukan/3d-scanner-api
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^sha-[0-9a-f]+$
          manifestTargets:
            helm:
              name: api.image.repository
              tag: api.image.tag
        - alias: worker
          imageName: ghcr.io/ieyoukan/3d-scanner-worker
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^sha-[0-9a-f]+$
          manifestTargets:
            helm:
              name: worker.image.repository
              tag: worker.image.tag
