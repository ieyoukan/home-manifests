{{- /*
  preview の全環境で、公式アカウント（ID ubichill）のパスワードを dev（ubichill-dev-secrets）と同じにする。
  preview の namespace は PR ごとに変わるので、cluster-wide で暗号化した（どの namespace でも復号できる）。
  ubichill の chart の backend.extraSecretRefs で読む（chart の secretEnv の空の値より後に読むので、こちらが勝つ）。
  dev のパスワードを変えたら、ここも作り直す。
*/}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: ubichill-preview-official
  namespace: {{ required "name を指定してください" .Values.name }}
spec:
  encryptedData:
    OFFICIAL_ACCOUNT_PASSWORD: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: ubichill-preview-official
