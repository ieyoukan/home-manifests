## サブチャート (kube-prometheus-stack) に渡すため、このキー配下に記述すること
kube-prometheus-stack:
  ## Grafana は既存のものを使用するため無効化
  grafana:
    enabled: false

  ## Prometheus 設定
  prometheus:
    prometheusSpec:
      ## データ保持期間
      retention: 30d

      ## Persistent Volume 設定
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: proxmox-data
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      ## k6 の負荷試験の結果を remote write で受ける（-o experimental-prometheus-rw）。
      ## 書き込みに認証は無いので、クラスタの外には出さない（Service は ClusterIP のまま）
      enableRemoteWriteReceiver: true
      ## k6 の Trend は p(50)/p(95)/p(99)/max の gauge で受ける（K6_PROMETHEUS_RW_TREND_STATS）。
      ## native-histograms の feature flag は scrape の形式まで変わり、既存の classic histogram を読む監視に響くので有効にしない

      ## 全ネームスペースの Custom Resource を自動検出
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      ## リソース制限
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 3Gi

  ## Alertmanager 設定
  alertmanager:
    alertmanagerSpec:
      ## Persistent Volume 設定
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: proxmox-data
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

      ## リソース制限
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

  ## Prometheus Operator 設定
  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false

  ## Node Exporter 設定（全ノードにデプロイするため tolerations を付与）
  nodeExporter:
    enabled: true
    tolerations:
      - operator: Exists

  ## k3s は 1 プロセスに全コンポーネントが入っており、kubelet の /metrics にも
  ## apiserver・etcd の指標が出る。apiserver ジョブと重複し series が約 2 倍になるため捨てる
  kubelet:
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: '(apiserver|etcd|aggregator|authentication|authorization|apiextensions|watch_cache|kube_apiserver)_.*'

  ## apiserver の大きいヒストグラムのうち、ルール・ダッシュボードで使わないものを捨てる
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: '(etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes)_bucket'

  ## k3s では controller-manager / scheduler / proxy / etcd の個別エンドポイントがなく、
  ## 常に *Down アラートが鳴るだけなので無効化する（指標は apiserver ジョブで取れている）
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  ## Kube State Metrics 設定
  kubeStateMetrics:
    enabled: true
