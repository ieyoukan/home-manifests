apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3d-scanner-secrets
  namespace: argocd
  annotations:
    # 本体（sync-wave 0）より先に同期し、Secret を用意しておく
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/ieyoukan/home-manifests.git
    targetRevision: main
    path: apps/3d-scanner
  destination:
    server: https://kubernetes.default.svc
    namespace: 3d-scanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
