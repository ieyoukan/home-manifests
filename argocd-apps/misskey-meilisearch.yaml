apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: misskey-meilisearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/ieyoukan/home-manifests.git
    targetRevision: main
    path: apps/misskey
    directory:
      recurse: false
      include: meilisearch.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: misskey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
