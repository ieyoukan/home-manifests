# 3D Scanner: スマホの写真から 3D モデル（メッシュ / 3DGS）を作る Web アプリ
# chart とアプリ本体: https://github.com/ieyoukan/3d-scanner
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3d-scanner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ieyoukan/3d-scanner.git
    targetRevision: main
    path: charts/3d-scanner
    helm:
      releaseName: scanner
      valuesObject:
        # 役割ごとのイメージ（画面 / API / 復元のワーカー）。tag は初期値で、以後は Argo CD Image Updater が
        # イメージごとに最新の :sha-<コミット> に更新する（apps/argocd/image-updater.yaml）。
        # 3d-scanner の CI は中身の変わったイメージだけを公開するので、画面だけ直したときにワーカーは入れ替わらない。
        web:
          image:
            repository: ghcr.io/ieyoukan/3d-scanner-web
            tag: sha-979b656
        api:
          image:
            repository: ghcr.io/ieyoukan/3d-scanner-api
            tag: sha-979b656
        worker:
          image:
            repository: ghcr.io/ieyoukan/3d-scanner-worker
            tag: sha-979b656

        # アプリ自体にはログインが無い。認証は Cloudflare Access（scanner.youkan.uk の前段）で行う。
        # マージ前に Cloudflare Zero Trust で Access アプリケーションを作っておくこと（無いと誰でも使える）。

        ingress:
          enabled: true
          className: cloudflare
          annotations: {}
          hosts:
            - host: scanner.youkan.uk
              paths:
                - path: /
                  pathType: Prefix
          tls: []

        # 写真・中間ファイル・成果物（保存期間を過ぎたら自動で消える）
        persistence:
          storageClass: proxmox-data
          size: 30Gi

        postgresql:
          auth:
            existingSecret: 3d-scanner-secrets
          persistence:
            storageClass: proxmox-data
            size: 2Gi

        config:
          # 写真と結果を保存する期間
          retention: 24h
          pipeline:
            # resources.limits.cpu と同じ値にする
            numThreads: 4
            # クラスタに GPU は無いので CPU で学習する。1 反復あたり 1 秒強の見込み
            splatIterations: 1000
            splatDownscale: 2

        # 以下の resources はワーカー（scanner-worker）のもの。画面と API は小さいので chart の既定のまま。
        # SfM と 3DGS は CPU を使い切る。ワーカーは 5 コア（home-infra の terraform: k3s_worker_defaults）なので、
        # 1 コアは同じノードの他のアプリ（ubichill の本番など）に残し、上限を 4 コアにする。
        # 位置推定は CPU での SIFT の照合が大半で、スレッド数にほぼ比例して速くなる。
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 6Gi

        # コア数の少ない control-plane のノードには載せない（ワーカーに寄せる）。3 つの Pod すべてに付く。
        # API とワーカーは同じ PVC を使うので、chart が同じノードに載せる（podAffinity）
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist

  destination:
    server: https://kubernetes.default.svc
    namespace: 3d-scanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 5
