apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: videoplayer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ieyoukan/ubichill-videoplayer.git
    targetRevision: main
    path: charts/video-player-backend
    helm:
      releaseName: video-player-backend
      valuesObject:
        image:
          repository: ghcr.io/ieyoukan/video-player-backend
          tag: sha-599c293
          pullPolicy: IfNotPresent
        # mod 3.1.0 とワールド lock の公開後、匿名利用トークンを必須にする。
        env:
          REQUIRE_SERVICE_TOKEN: "true"
        # VODは同一origin file gatewayを使う。sidecar readinessで全Podを
        # Serviceから外さないよう、本番ではoptional providerを無効化する。
        potProvider:
          enabled: false
        ingress:
          enabled: true
          className: cloudflare
          annotations: {}
          hosts:
            - host: videoplayer.youkan.uk
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: video-player-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
