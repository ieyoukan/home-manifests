apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ubichill-preview
  namespace: argocd
spec:
  generators:
    - pullRequest:
        github:
          owner: ubichill
          repo: ubichill
          labels:
            - preview
          tokenRef:
            secretName: argocd-image-updater-git-creds
            key: password
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'ubichill-preview-pr-{{number}}'
      labels:
        environment: preview
        component: ubichill
        pr-number: '{{number}}'
      annotations:
        notifications.argoproj.io/subscribe.on-preview-deployed.discord: ""
        notifications.argoproj.io/subscribe.on-preview-deleted.discord: ""
        notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/ubichill/ubichill
        targetRevision: '{{head_sha}}'
        path: charts/ubichill
        helm:
          valueFiles: ["values-dev.yaml"]
          parameters:
            - name: global.domain
              value: 'pr-{{number}}.ubichill.com'
            - name: backend.image.tag
              value: 'sha-{{head_sha}}'
            - name: frontend.image.tag
              value: 'sha-{{head_sha}}'
            - name: instanceRuntime.image.tag
              value: 'sha-{{head_sha}}'
          valuesObject:
            global:
              imageRegistry: ""
            postgresql:
              auth:
                password: "preview-pr-{{number}}"
                postgresPassword: "preview-pr-{{number}}-admin"
              primary:
                persistence:
                  enabled: false
            redis:
              master:
                persistence:
                  enabled: false
            backend:
              image:
                repository: ghcr.io/ubichill/ubichill-backend
              secretEnv:
                # 開発専用。chartの古い既定値でもGo/SNSに同じ32文字以上のキーを渡す。
                INSTANCE_ADMIN_TOKEN: "dev-instance-admin-token-not-for-production"
              env:
                INSTANCE_EMPTY_TIMEOUT_MS: "5000"
                INSTANCE_REAP_INTERVAL_MS: "1000"
                INSTANCE_RECOVERY_GRACE_MS: "60000"
                SKIP_EMAIL_VERIFICATION: "true"
                WORLDS_FEDERATION_PEERS: "https://ubichill.com"
            frontend:
              image:
                repository: ghcr.io/ubichill/ubichill-frontend
            instanceRuntime:
              secretKey: INSTANCE_ADMIN_TOKEN
              image:
                repository: ghcr.io/ubichill/ubichill-instance
            nodeAffinity:
              enabled: false
            ingress:
              className: cloudflare
              annotations: {}
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-pr-{{number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            environment: preview
            component: ubichill
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=background
          - Replace=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
            - /spec/template/spec/containers/0/securityContext/capabilities
            - /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
      revisionHistoryLimit: 2
