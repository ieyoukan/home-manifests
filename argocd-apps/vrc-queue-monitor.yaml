apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vrc-queue-monitor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ieyoukan/vrc-queue-monitor.git
    targetRevision: HEAD
    path: charts/vrc-queue-monitor
    helm:
      releaseName: vrc-queue-monitor
      valueFiles:
        - values.yaml
      valuesObject:
        secrets:
          existingSecret: "vrc-queue-monitor-secrets"
        ingress:
          enabled: true
          className: cloudflare
          annotations: {}
          hosts:
            - host: vrc-monitor.youkan.uk
              paths:
                - path: /
                  pathType: Prefix
                  service: frontend
          tls: []
        postgres:
          persistence:
            enabled: true
            storageClass: "proxmox-data"
            size: 5Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: vrc-queue-monitor

  syncPolicy:
    ## automated を有効にしないと Image Updater の write-back 後に sync されない
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
