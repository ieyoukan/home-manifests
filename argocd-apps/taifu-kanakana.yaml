apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taifu-kanakana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 台風かなかな：台風の日の恋愛マッチングアプリのモック（事業案発表用・静的SPA）
    repoURL: https://github.com/ieyoukan/taifu-kanakana.git
    targetRevision: main
    path: charts/taifu-kanakana
    helm:
      releaseName: taifu-kanakana
      valueFiles:
        - values.yaml
      valuesObject:
        image:
          repository: ghcr.io/ieyoukan/taifu-kanakana
          tag: latest
        ingress:
          enabled: true
          className: cloudflare
          hosts:
            - host: taifu-kanakana.youkan.uk
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: taifu-kanakana
  syncPolicy:
    # Image Updater の write-back 後に自動で sync させる
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
