apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubichill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-prod-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
spec:
  project: default
  source:
    repoURL: https://github.com/ubichill/ubichill
    targetRevision: main
    path: charts/ubichill
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      valuesObject:
        global:
          domain: ubichill.com
          imageRegistry: ""
        backend:
          existingSecret: "ubichill-secrets"
          image:
            repository: ghcr.io/ubichill/ubichill-backend
            tag: latest
          env:
            RATE_LIMIT_MAX_REQUESTS: "10000"
            RATE_LIMIT_WINDOW_MS: "900000"
            MAIL_FROM: "Ubichill <noreply@ubichill.com>"
          healthcheck:
            livenessProbe:
              initialDelaySeconds: 90
              periodSeconds: 45
              timeoutSeconds: 15
              failureThreshold: 6
            readinessProbe:
              initialDelaySeconds: 45
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 5
        frontend:
          image:
            repository: ghcr.io/ubichill/ubichill-frontend
            tag: latest
        instanceRuntime:
          image:
            repository: ghcr.io/ubichill/ubichill-instance
            tag: latest
        nodeAffinity:
          enabled: false
        ingress:
          className: cloudflare
          annotations: {}
        redis:
          master:
            persistence:
              storageClass: "proxmox-data"
        postgresql:
          auth:
            existingSecret: "ubichill-secrets"
            secretKeys:
              adminPasswordKey: POSTGRES_PASSWORD
              userPasswordKey: POSTGRES_PASSWORD
            username: "ubichill"
            database: "ubichill"
          primary:
            persistence:
              storageClass: "proxmox-data"
              size: 10Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: ubichill
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=background
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
        - /spec/template/spec/containers/0/securityContext/capabilities
        - /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
