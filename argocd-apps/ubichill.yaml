apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubichill
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-prod-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
spec:
  project: default
  source:
    repoURL: https://github.com/ubichill/ubichill
    targetRevision: main
    path: charts/ubichill
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
      valuesObject:
        global:
          domain: ubichill.com
          imageRegistry: ""
        backend:
          existingSecret: "ubichill-secrets"
          image:
            repository: ghcr.io/ubichill/ubichill-backend
            tag: latest
          env:
            INSTANCE_EMPTY_TIMEOUT_MS: "5000"
            INSTANCE_REAP_INTERVAL_MS: "1000"
            INSTANCE_RECOVERY_GRACE_MS: "60000"
            RATE_LIMIT_MAX_REQUESTS: "10000"
            RATE_LIMIT_WINDOW_MS: "900000"
            MAIL_FROM: "Ubichill <noreply@ubichill.com>"
          healthcheck:
            livenessProbe:
              initialDelaySeconds: 90
              periodSeconds: 45
              timeoutSeconds: 15
              failureThreshold: 6
            readinessProbe:
              initialDelaySeconds: 45
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 5
        frontend:
          image:
            repository: ghcr.io/ubichill/ubichill-frontend
            tag: latest
        instanceRuntime:
          image:
            repository: ghcr.io/ubichill/ubichill-instance
            tag: latest
          # 部屋の割り当てを Redis で共有する（複数台の前提）
          directory: redis
          # Go の指標を Prometheus に集める（KEDA の台数の判断に使う）
          metrics:
            serviceMonitor:
              enabled: true
          # KEDA で台数を増やす（減らすのは手動。閾値は chart の既定 = ubichill#271 の負荷試験から）。
          # 上限 3 はクラスタの空き（2 コア 3 台 + 5 コア 1 台、平常 50〜70%）に合わせる。
          autoscaling:
            enabled: true
            maxReplicaCount: 3
        nodeAffinity:
          enabled: false
        ingress:
          className: cloudflare
          annotations: {}
        redis:
          # Argo CD の描画で乱数を生成させない。現在稼働中の Redis と同じパスワードを Secret に固定する。
          auth:
            existingSecret: ubichill-secrets
            existingSecretPasswordKey: REDIS_PASSWORD
          master:
            persistence:
              storageClass: "proxmox-data"
        postgresql:
          auth:
            existingSecret: "ubichill-secrets"
            secretKeys:
              adminPasswordKey: POSTGRES_PASSWORD
              userPasswordKey: POSTGRES_PASSWORD
            username: "ubichill"
            database: "ubichill"
          primary:
            persistence:
              storageClass: "proxmox-data"
              size: 10Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: ubichill
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=background
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5
  ignoreDifferences:
    # 台数は KEDA（HPA）が持つ。同期で戻さない
    - group: apps
      kind: Deployment
      name: ubichill-instance
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
        - /spec/template/spec/containers/0/securityContext/capabilities
        - /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/resources/requests/storage
